# Local environment that builds and runs the production-style application image
# against real infrastructure. Not intended to be deployed as-is.
#
#   docker compose -f docker-compose.dev.yml build
#   docker compose -f docker-compose.dev.yml up
#
# Backing services are published only on 127.0.0.1 for local debugging; a
# production compose/stack would omit those port mappings entirely.

x-app-env: &app-env
    APP_NAME: 'Laravel'
    APP_ENV: local
    APP_DEBUG: 'true'
    APP_KEY: 'base64:cKY0arNdwbFl3cOgnFA4/nrL3TOVXGdYM1hUhPeWEQQ='
    APP_URL: 'http://localhost:8000'

    LOG_CHANNEL: stack
    LOG_STACK: single
    LOG_LEVEL: debug

    # PostgreSQL
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: '5432'
    DB_DATABASE: laravel
    DB_USERNAME: laravel
    DB_PASSWORD: secret

    # Redis (cache + queue + sessions + Horizon)
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    REDIS_PASSWORD: 'null'

    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    BROADCAST_CONNECTION: log

    # Object storage (MinIO, S3-compatible)
    FILESYSTEM_DISK: s3
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin
    AWS_DEFAULT_REGION: us-east-1
    AWS_BUCKET: local
    AWS_ENDPOINT: 'http://minio:9000'
    AWS_URL: 'http://localhost:9000/local'
    AWS_USE_PATH_STYLE_ENDPOINT: 'true'

    # Mail (Mailpit)
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: '1025'
    MAIL_USERNAME: 'null'
    MAIL_PASSWORD: 'null'
    MAIL_SCHEME: 'null'
    MAIL_FROM_ADDRESS: 'hello@example.com'
    MAIL_FROM_NAME: 'Laravel'

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: app
        image: demo-app:dev
        restart: unless-stopped
        environment:
            <<: *app-env
            # Dev convenience: run migrations on start. See notes in the Dockerfile /
            # README about why this is opt-in rather than automatic in production.
            RUN_MIGRATIONS: 'true'
            WAIT_FOR_DB: 'true'
            OCTANE_WORKERS: 'auto'
            OCTANE_MAX_REQUESTS: '500'
        ports:
            - '${APP_PORT:-8000}:8000'
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            minio:
                condition: service_healthy
            minio-init:
                condition: service_completed_successfully
            mailpit:
                condition: service_started

    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: laravel
            POSTGRES_USER: laravel
            POSTGRES_PASSWORD: secret
        volumes:
            - pgdata:/var/lib/postgresql/data
        ports:
            - '127.0.0.1:${DB_PORT_HOST:-5432}:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U laravel -d laravel']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:8-alpine
        restart: unless-stopped
        command: ['redis-server', '--appendonly', 'yes']
        volumes:
            - redisdata:/data
        ports:
            - '127.0.0.1:${REDIS_PORT_HOST:-6379}:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10

    minio:
        image: minio/minio:latest
        restart: unless-stopped
        command: ['server', '/data', '--console-address', ':9001']
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
        volumes:
            - miniodata:/data
        ports:
            - '127.0.0.1:${MINIO_API_PORT_HOST:-9000}:9000' # S3 API
            - '127.0.0.1:${MINIO_CONSOLE_PORT_HOST:-9001}:9001' # web console
        healthcheck:
            test:
                [
                    'CMD',
                    'curl',
                    '-fsS',
                    'http://localhost:9000/minio/health/live',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    # One-shot: create the dev bucket, then exit.
    minio-init:
        image: minio/mc:latest
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: >
            /bin/sh -c "
            mc alias set local http://minio:9000 minioadmin minioadmin &&
            mc mb --ignore-existing local/local &&
            mc anonymous set download local/local &&
            echo 'minio-init: bucket \"local\" ready';
            "
        restart: 'no'

    mailpit:
        image: axllent/mailpit:latest
        restart: unless-stopped
        environment:
            MP_MAX_MESSAGES: '500'
            MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
        ports:
            - '127.0.0.1:${MAILPIT_UI_PORT_HOST:-8025}:8025' # web UI
            - '127.0.0.1:${MAILPIT_SMTP_PORT_HOST:-1025}:1025' # SMTP
        healthcheck:
            test: ['CMD', 'wget', '-q', '-O-', 'http://localhost:8025/readyz']
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    pgdata:
    redisdata:
    miniodata:
