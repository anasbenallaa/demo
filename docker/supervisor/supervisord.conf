[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Local socket so `docker compose exec app supervisorctl status` works.
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; --- Laravel Octane (FrankenPHP) — the HTTP application server ---------------
[program:octane]
command=php artisan octane:start
    --server=frankenphp
    --host=0.0.0.0
    --port=8000
    --caddyfile=/etc/frankenphp/Caddyfile
    --workers=%(ENV_OCTANE_WORKERS)s
    --max-requests=%(ENV_OCTANE_MAX_REQUESTS)s
directory=/app
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; --- Laravel Horizon — queue workers, separate process --------------------
[program:horizon]
command=php artisan horizon
directory=/app
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=120
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
